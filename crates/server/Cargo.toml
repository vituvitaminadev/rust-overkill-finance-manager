[package]
name = "finance-server"
version = "0.1.0"
description = "O Anfitrião de uma residência e a ligação das cópias com ele"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio", "http1"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
finance-core = { version = "0.1.0", path = "../core" }
futures-util = "0.3.34"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
uuid = "1.29.2"

[dev-dependencies]
chrono = "0.4.45"
